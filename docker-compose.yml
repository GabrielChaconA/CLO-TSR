services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wearlab-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wearlab-backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./backend/.env.example # Usar temporalmente la plantilla de variables de entorno (o .env si existe)
    environment:
      - NODE_ENV=development
      - PORT=5000
    restart: always
